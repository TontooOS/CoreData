[lib]
crate-type = ["dylib"]

[package]
name = "coredata"
version = "26.1.0"
edition = "2021"
authors = ["arlomu"]
description = "Tontoo CoreData – encrypted, per-app isolated persistence for TontooOS (FishFile .fico + SQLite)"
license = "TCL"
repository = "https://github.com/TontooOS/CoreData"
keywords = ["tontoo", "coredata", "fico", "sqlite", "encrypted"]
categories = ["database", "config", "encoding"]
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
indexmap = { version = "2", features = ["serde"] }
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
fishfile = { path = "../FishFile" }
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
base64 = "0.22"
once_cell = "1"
fs2 = "0.4"

[features]
default = []
ffi = []

[dev-dependencies]
tempfile = "3"
