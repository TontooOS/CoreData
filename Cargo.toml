[lib]
crate-type = ["cdylib", "rlib"]

[package]
name = "coredata"
version = "27.0.0"
edition = "2021"
authors = ["arlomu"]
description = "Tontoo CoreData – encrypted, per-app isolated persistence for TontooOS (FishFile .fico + SQLite)"
license = "TCL"
repository = "https://github.com/TontooOS/CoreData"
keywords = ["tontoo", "coredata", "fico", "sqlite", "encrypted"]
categories = ["database", "config", "encoding"]
readme = "README.md"

[dependencies]
foundation = { path = "../Foundation" }
fishfile = { path = "../FishFile" }
sqlkit = { path = "../SQLKit" }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }

[features]
default = []
ffi = []

[dev-dependencies]
tempfile = "3"
# Migration test only: proves files written by the old rusqlite backend
# stay readable. Never a production dependency.
rusqlite = { version = "0.32", features = ["bundled"] }
